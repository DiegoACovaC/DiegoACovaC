    .title { fill: #8fbdf0; font-size: 12px; }
    .label { fill: #5b9be0; font-size: 10px; letter-spacing: 2px; }
    .k { fill: #6cb4ff; font-size: 13px; }
    .v { fill: #dce9fb; font-size: 13px; }
    .sep { fill: #274a7a; font-size: 13px; }
    .panel { fill: #080e18; stroke: #2b6cc4; stroke-opacity: 0.6; }
    .sprite { animation: bob 3.2s ease-in-out infinite; }
    .live { fill: #5aa9ff; font-size: 10px; letter-spacing: 1px; }
    .dot { fill: #5aa9ff; animation: pulse 1.6s ease-in-out infinite; }
    .row { animation: fadein 0.5s ease-out both; }
    .scan { fill: #5aa9ff; fill-opacity: 0.08; animation: scan 4s linear infinite; }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    @keyframes pulse { 50% { opacity: 0.25; } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(190px); } }
  </style>

